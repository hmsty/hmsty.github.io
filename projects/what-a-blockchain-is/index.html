<style>

}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#e9e7e2; } }

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}

body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

  text-shadow:0 0 2px var(--halo),0 0 8px var(--halo),0 0 14px var(--halo);will-change:transform,opacity}
.lbl small{display:block;font-weight:400;font-size:12.5px;color:var(--soft);margin-top:1px}
.lbl.brass{color:#9a7236} .lbl.blue{color:var(--blue)} .lbl.red{color:var(--red)} .lbl.warm{color:var(--amber)} .lbl.green{color:var(--green)} .lbl.graphite{color:var(--graphite)}
.lbl.stage{font-size:19px;font-weight:600;letter-spacing:-.01em}
.lbl.num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:400;color:var(--soft);padding:6px 0 0}
#veil{position:absolute;inset:0;background:var(--bg);pointer-events:none;opacity:0}

#card h2{margin:0;font-size:clamp(26px,4.2vmin,46px);font-weight:500;letter-spacing:-.02em;text-shadow:0 0 12px var(--halo),0 0 24px var(--halo)}
#card .n{display:block;font-size:clamp(11px,1.5vmin,14px);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:.5em;text-shadow:0 0 10px var(--halo)}

#close{position:absolute;left:50%;top:14%;transform:translateX(-50%);pointer-events:none;opacity:0;display:grid;gap:10px;font-size:clamp(15px,2.2vmin,22px);font-weight:500;letter-spacing:-.01em}
#close div{display:flex;align-items:center;gap:12px;text-shadow:0 0 10px var(--halo),0 0 20px var(--halo)}
#close svg{flex:none}

@media (max-aspect-ratio:1/1){ #map{width:clamp(120px,36vw,170px);top:auto;bottom:calc(118px + env(safe-area-inset-bottom,0px))} body.clean #map{bottom:clamp(12px,2.2vmin,28px)} #card{top:8%} #close{width:88%;font-size:clamp(14px,3.8vw,18px)} }

  padding:12px max(22px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left));font-size:13px}

button:hover{border-color:var(--soft)}
button:focus-visible,.track:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.track i{position:absolute;left:0;top:13px;height:1px;background:var(--ink)}

@media (max-width:640px){ .clips{flex-wrap:nowrap;width:100%} .clips button{flex:1;padding:6px 0} .clips .cl{display:none} .row{min-width:0;width:100%;gap:8px} .row button{padding:6px 10px;font-size:12px} .bar{gap:8px} #clock,#loop,#frm,#rec{display:none} .track{min-width:80px} }
#rec[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}

<div id="stage">
  <canvas id="gl" tabindex="0" aria-label="An animated explainer that follows one payment through Ethereum in six chapters: copies of one ledger, signatures, a chain of fingerprints, stake and consensus, finality, and programs. Each idea arrives when the story needs it and stays in the scene; each chapter shows the attack it defeats."></canvas>
  <div id="labels" aria-hidden="true"></div>

<script>
(function(){
'use strict';
if(!window.THREE){ document.getElementById('err').style.display='flex'; return; }
THREE.ColorManagement.legacyMode=false;
const canvas=document.getElementById('gl');
let renderer; try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true}); }catch(e){ document.getElementById('err').style.display='flex'; return; }
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

/* ======================= math ======================= */
const V=(x,y,z)=>new THREE.Vector3(x,y,z), C=h=>new THREE.Color(h);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), seg=(t,a,b)=>clamp((t-a)/(b-a)), lerp=(a,b,u)=>a+(b-a)*u;
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const win=(t,a,b)=>ease(seg(t,a,b));
const fade=(t,a,b,f=.4)=>Math.min(seg(t,a,a+f),1-seg(t,b-f,b));
const decay=(t,a,k=2.4)=>t>=a?Math.exp(-(t-a)*k):0;
const arc=(a,b,u,h,o)=>{ o=o||V(); o.lerpVectors(a,b,u); o.y+=Math.sin(Math.PI*u)*h; return o; };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// FNV-1a 32-bit stands in for Keccak-256: every fingerprint on screen is really computed from a block's contents and its parent's fingerprint
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(16).padStart(8,'0');}

/* ======================= stage ======================= */
const STAGE=C('#e9e7e2');
const scene=new THREE.Scene(); scene.background=STAGE.clone(); scene.fog=new THREE.Fog(STAGE.clone(),34,95);
const camera=new THREE.PerspectiveCamera(30,16/9,.3,260);
scene.add(new THREE.HemisphereLight(0xfbf8f3,0xc9c3ba,.62));
const sun=new THREE.DirectionalLight(0xfff4e8,1.0); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:100}); sun.shadow.bias=-.0003; sun.shadow.normalBias=.02; sun.shadow.radius=4; scene.add(sun); scene.add(sun.target);
const fill=new THREE.DirectionalLight(0xdfe8ff,.28); fill.position.set(16,10,-14); scene.add(fill);
{ const f=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({color:STAGE,roughness:1})); f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f); }

/* ======================= materials, each tagged with the primitive it belongs to ======================= */
const MATS=[];
function mat(tag,o){ const m=new THREE.MeshStandardMaterial(o); m.userData.tag=tag; m.userData.base=m.color.clone(); m.userData.baseE=m.emissive.clone(); m.userData.baseEI=m.emissiveIntensity; m.userData.baseO=m.opacity; MATS.push(m); return m; }
const M={
  // context
  white:mat('ctx',{color:'#f2f0ec',roughness:.62}), stone:mat('ctx',{color:'#cfcbc4',roughness:.8}), stoneD:mat('ctx',{color:'#bdb8b0',roughness:.8}),
  tile:mat('ctx',{color:'#dfe4ea',roughness:.6}),
  final:mat('ctx',{color:'#a9a397',roughness:.7}), gateS:mat('ctx',{color:'#9a958c',roughness:.55}), gateF:mat('ctx',{color:'#6f6a62',roughness:.5}),
  // signature: graphite, only ever used for signatures
  seal:mat('sig',{color:'#3a3e44',roughness:.45}), signet:mat('sig',{color:'#3a3e44',roughness:.4}),
  // fingerprint: ridge and socket
  ridge:mat('hash',{color:'#c9a062',roughness:.34,metalness:.35,emissive:'#6b4a1c',emissiveIntensity:.12}), socket:mat('hash',{color:'#8c6b3e',roughness:.45,metalness:.25}),
  // stake: blue, only ever ETH
  coin:mat('stake',{color:'#3a6fbf',emissive:'#1f4f9a',emissiveIntensity:.22,roughness:.45}), coinFresh:mat('stake',{color:'#9cc2ff',emissive:'#5b8fe0',emissiveIntensity:.6,roughness:.35}),
  well:mat('stake',{color:'#2b2e33',roughness:.9}), spot:mat('stake',{color:'#5b8fe0',emissive:'#2f63ad',emissiveIntensity:.8,roughness:.4}),
  // state
  stateBar:mat('state',{color:'#6d8f7e',roughness:.5}), stateBarY:mat('state',{color:'#e08a4f',roughness:.5}), stateBarC:mat('state',{color:'#8a7fb0',roughness:.5}), panel:mat('state',{color:'#f7f5f1',roughness:.6}),
  gear:mat('state',{color:'#8a7fb0',roughness:.45}),
  // your transaction
  amber:mat('you',{color:'#ff7a33',emissive:'#ff5a14',emissiveIntensity:.5,roughness:.45}), amberF:mat('you',{color:'#ffd2b3',emissive:'#ff6a1a',emissiveIntensity:.25,roughness:.6}),
  // signals are never dimmed
  flash:mat('signal',{color:'#ffffff',emissive:'#ffffff',emissiveIntensity:.55,roughness:.35}),
  red:mat('signal',{color:'#e2573f',emissive:'#c4331f',emissiveIntensity:.5,roughness:.5}), green:mat('signal',{color:'#5fb88a',emissive:'#2f8a5e',emissiveIntensity:.6,roughness:.4}),
  ghost:mat('signal',{color:'#d9dde5',roughness:.5,transparent:true,opacity:.72,depthWrite:false}),
  ghostR:mat('signal',{color:'#c9a062',roughness:.4,transparent:true,opacity:.8,depthWrite:false}),
  ghostT:mat('signal',{color:'#dfe4ea',roughness:.6,transparent:true,opacity:.6,depthWrite:false}),
  ghostS:mat('signal',{color:'#8c6b3e',roughness:.5,transparent:true,opacity:.75,depthWrite:false})
};
const DIMC=STAGE.clone();
function applyLens(lens,amt){ for(const m of MATS){ const tg=m.userData.tag; let d=0;
  if(lens==='all'){ if(tg==='ctx') d=amt*.55; }
  else if(lens&&tg!=='signal'&&tg!==lens) d=amt*(tg==='you'?.08:tg==='ctx'?.62:.8);
  m.color.copy(m.userData.base).lerp(DIMC,d); m.emissive.copy(m.userData.baseE); m.emissiveIntensity=m.userData.baseEI*(1-d);
  if(m.transparent&&tg!=='signal') m.opacity=m.userData.baseO; } }
let LENS=null, LENSAMT=0;
const dimOf=tag=>LENS&&tag!==LENS&&tag!=='signal'?LENSAMT:0;

const RB=(w,h,d,r)=>new THREE.RoundedBoxGeometry(w,h,d,3,r===undefined?Math.min(w,h,d)*.18:r);
const BOX=new THREE.BoxGeometry(1,1,1);
function solid(geo,m,x,y,z,parent,cast=true){ const o=new THREE.Mesh(geo,m); o.position.set(x,y,z); o.castShadow=cast; o.receiveShadow=true; (parent||scene).add(o); return o; }
const GT=(()=>{ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); const gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.25,'rgba(255,255,255,.45)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); })();
const BLUE=C('#3a6fbf'), RED=C('#c4331f'), GREEN=C('#2f8a5e'), AMB=C('#ff6a1a'), BLACK=C('#000000'), GRAPH=C('#3a3e44'), TRB=C('#8fb0e0'), TRA=C('#ff8a4a'), TRG=C('#6a6f76'), WHITEG=C('#ffffff'), VIOLET=C('#8a7fb0');

/* ======================= pools: everything transient is claimed fresh each frame ======================= */
function Pool(make){ const arr=[]; let n=0; return { reset(){ for(let i=0;i<n;i++) arr[i].visible=false; n=0; }, get(){ if(n>=arr.length) arr.push(make()); const o=arr[n++]; o.visible=true; o.rotation.set(0,0,0); o.scale.setScalar(1); return o; } }; }
const P_=[];
const pool=f=>{ const p=Pool(f); P_.push(p); return p; };
const QTILE=RB(.3,.04,.22,.015);
const tiles=pool(()=>{ const m=new THREE.Mesh(QTILE,M.tile); scene.add(m); return m; });
const SEALG=new THREE.CylinderGeometry(1,1,1,24);
const seals=pool(()=>{ const m=new THREE.Mesh(SEALG,M.seal); m.castShadow=true; scene.add(m); return m; });
const COING=new THREE.CylinderGeometry(.22,.22,.07,28);
const coins=pool(()=>{ const m=new THREE.Mesh(COING,M.coin); m.castShadow=true; scene.add(m); return m; });
const glows=pool(()=>{ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,color:'#ffffff',transparent:true,opacity:0,depthWrite:false})); scene.add(s); return s; });
const RIPG=new THREE.TorusGeometry(1,.022,8,64);
const ripples=pool(()=>{ const m=new THREE.Mesh(RIPG,new THREE.MeshBasicMaterial({color:'#3a6fbf',transparent:true,opacity:0,depthWrite:false})); scene.add(m); return m; });
const RINGG=new THREE.TorusGeometry(.2,.028,10,40);
const rings=pool(()=>{ const m=new THREE.Mesh(RINGG,new THREE.MeshStandardMaterial({color:'#3a3e44',roughness:.4,emissive:'#000000'})); m.castShadow=true; scene.add(m); return m; });
const bars=pool(()=>{ const m=new THREE.Mesh(BOX,M.stateBar); m.castShadow=true; scene.add(m); return m; });
// a vote: a coin (stake) carrying a ridge chip (the fingerprint voted on) and a seal (the signature)
const TCHIP=RB(.24,.045,.14,.015);
const tokens=pool(()=>{ const g=new THREE.Group(); const c=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.05,28),M.coin); c.position.y=.025; c.castShadow=true; g.add(c);
  const ch=new THREE.Mesh(TCHIP,M.ridge); ch.position.y=.072; g.add(ch); const s=new THREE.Mesh(SEALG,M.seal); s.scale.set(.05,.02,.05); s.position.y=.104; g.add(s); g.userData={c}; scene.add(g); return g; });
function token(p,r,sc){ const g=tokens.get(); g.position.copy(p); g.userData.c.scale.set(r,1,r); if(sc!==undefined) g.scale.setScalar(sc); return g; }
function glowAt(p,color,size,op){ if(op<=.005) return; const s=glows.get(); s.position.copy(p); s.scale.set(size,size,1); s.material.color.copy(color); s.material.opacity=op; }
function tileAt(p,m,sc,rotY){ const o=tiles.get(); o.material=m||M.tile; o.position.copy(p); if(sc!==undefined) o.scale.setScalar(sc); if(rotY) o.rotation.y=rotY; return o; }
function sealAt(p,r,sc){ const s=seals.get(); s.position.copy(p); s.scale.set(r*(sc===undefined?1:sc),.02,r*(sc===undefined?1:sc)); return s; }
function ripple(p,t0,t,color,size,dur){ size=size||.7; dur=dur||.7; if(t<t0||t>t0+dur) return; const u=(t-t0)/dur; const m=ripples.get(); m.rotation.set(Math.PI/2,0,0); m.position.copy(p); const r=.12+size*ease(u); m.scale.set(r,r,r); m.material.color.copy(color); m.material.opacity=.75*(1-u); }
function trail(a,b,u,h,color,size,n,du){ size=size||.26; n=n||7; du=du||.03; if(u<=0||u>=1) return; for(let k=1;k<=n;k++){ const uk=u-k*du; if(uk<=0) break; glowAt(arc(a,b,uk,h),color,size*(1-.5*k/n),.42*(1-k/n)); } }
// public key check: a graphite ring settles over a seal. green if it fits, red and bouncing if it does not
function checkRing(p,ta,t,ok,r){ r=r||1; if(t<ta-.35||t>ta+1.05) return; const m=rings.get(); m.rotation.set(Math.PI/2,0,0); const d=win(t,ta-.35,ta); let y=p.y+.9-(.9-(ok?0:.14))*d; if(!ok) y+=.4*win(t,ta+.05,ta+.45); m.position.set(p.x,y,p.z); m.scale.setScalar(r*((1-seg(t,ta+.65,ta+1.05))||.001));
  const v=t>=ta?1:0; const c=GRAPH.clone().lerp(ok?GREEN:RED,v); if(!ok||v===0){} m.material.color.copy(c); m.material.emissive.copy(BLACK).lerp(ok?GREEN:RED,v*.6);
  if(t>=ta) glowAt(V(p.x,p.y+.05,p.z),ok?GREEN:RED,.9*r,.45*decay(t,ta,2)); }
function lineGlow(a,b,color,op,n){ n=n||14; for(let k=0;k<=n;k++) glowAt(V().lerpVectors(a,b,k/n),color,.22,op); }
/* ======================= the ring of nodes ======================= */
const PT=.3, R=6.5, NN=16;
const ang=i=>Math.PI/2+(i+.5)*2*Math.PI/NN;                 // half-step offset leaves the -x axis open for the chain
const nodePos=i=>V(R*Math.cos(ang(i)),0,R*Math.sin(ang(i)));
const nodeTop=i=>{ const p=nodePos(i); return V(p.x,1.87,p.z); };
const stackPos=i=>nodePos(i).multiplyScalar((R-1.05)/R);
const ringDist=(a,b)=>{ const d=Math.abs(a-b)%NN; return Math.min(d,NN-d); };
solid(new THREE.CylinderGeometry(8.6,8.8,.3,128),M.stone,0,.15,0);

  if(a!==null){ mDot.setAttribute('cx',CX+RR*Math.cos(a)); mDot.setAttribute('cy',CY+RR*Math.sin(a)); mDot.style.opacity=1; } else mDot.style.opacity=0;
  const lens=LENS&&LENS!=='all'?LENS:null;
  for(let k=0;k<6;k++){ const on=k===stage; const lit=!lens||TOUCH[lens].includes(k); const c=document.getElementById('mS'+k); c.setAttribute('fill',on?'#23262a':'#e9e7e2'); c.style.opacity=lit?1:.3; const tx=document.getElementById('mT'+k); tx.style.opacity=lit?1:.3; tx.setAttribute('font-weight',on?'600':'400'); }
  mRows.forEach(r=>{ const p=r.dataset.p; const kn=known(p); r.style.opacity=!kn?0:(lens&&lens!==p?.35:1); r.querySelector('.mhl').setAttribute('opacity',(.9*decay(T,KNOW[p],1.2)).toFixed(3)); });
  mGs.forEach(g=>{ const p=g.dataset.p; g.style.opacity=!known(p)?0:(lens&&lens!==p?.2:1); }); }

/* ======================= cards and closing ======================= */
const cardEl=document.getElementById('card'), cardN=cardEl.querySelector('.n'), cardH=cardEl.querySelector('h2'), cardP=cardEl.querySelector('p');
const closeEl=document.getElementById('close');
const CLOSE=[['sig','Signatures prove who authorized it'],['hash','Fingerprints prove what it holds and what came before'],['stake','Stake makes cheating expensive'],['state','Every node computes the same result']];
closeEl.innerHTML=CLOSE.map(([p,s])=>`<div><svg width="26" height="26" viewBox="0 0 26 26">${glyph(p,13,13,1.7)}</svg><span>${s}</span></div>`).join('');
const closeRows=[...closeEl.children];
const CARDS=[{T:0,d:3.4,n:'',h:'What a blockchain is',p:'Follow one payment through the whole system'},{T:3.3,d:2.6,n:'Prologue',h:'Digital Scarcity',p:''}];
CHAPTERS.forEach(([h,id],k)=>CARDS.push({T:SHOT[id].T0+(k===0?4.4:.2),d:k===0?3.4:2.8,n:(k+1)+' of 6',h,p:''}));
let cardKey=-1;
function updateOverlays(T,sh,t){ let o=0, ci=-1; CARDS.forEach((c,k)=>{ const f=fade(T,c.T,c.T+c.d,.5); if(f>o){ o=f; ci=k; } });
  if(ci>=0&&ci!==cardKey){ const c=CARDS[ci]; cardN.textContent=c.n; cardH.textContent=c.h; cardP.textContent=c.p; cardKey=ci; }
  cardEl.style.opacity=o.toFixed(3);
  if(sh.id==='close'){ closeEl.style.opacity=1; closeRows.forEach((r,k)=>r.style.opacity=fade(t,1+k*1.1,11.8,.6).toFixed(3)); } else closeEl.style.opacity=0;
  document.getElementById('veil').style.opacity=(T>FILM-.6?seg(T,FILM-.6,FILM):(T<.6?1-seg(T,0,.6):0)).toFixed(3); }

/* ======================= the world as a function of film time ======================= */
function lensAt(sh,t){ const prev=SHOTS[sh.k-1]; const L=sh.lens, Pv=prev?prev.lens:null;
  if(L===Pv) return [L,L?1:0];
  if(!Pv) return [L,win(t,0,.9)];
  if(!L) return [Pv,1-win(t,0,.9)];
  return t<.45?[Pv,1-win(t,0,.45)]:[L,win(t,.45,.9)]; }
function world(T){
  const {sh,t}=shotAt(T); const wl=sh.wlead||0; tNow=Math.max(0,t-wl);
  resetWorld();
  const [L,la]=lensAt(sh,t); LENS=la>0?L:null; LENSAMT=la; applyLens(LENS,LENSAMT);
  const s=slotClock(sh,t); sNow=s;
  if(sh.id==='scarcity'){ scarcity(t); stakes({},T); }
  else if(sh.id==='copies'){ // one keeper, then many copies
    PED.visible=true; PED.position.y=PT+.65-1.5*win(t,6.6,7.6);
    const bs=2.2*(1-win(t,6.2,7.0)); if(bs>.01){ BIGB.visible=true; BIGB.scale.setScalar(bs); BIGB.position.set(0,PED.position.y+.65+.35*win(t,3.4,4.4),0); }
    for(let i=0;i<NN;i++){ const N=NODES[i], tr=4.0+i*.05, rise=win(t,tr,tr+.9); if(t<tr){ N.g.visible=false; continue; }
      N.g.position.y=lerp(-2.4,0,rise); const u=win(t,4.6+i*.06,6.4+i*.06);
      if(u<=0) N.book.visible=false; else { const home=V(0,PT+1.3,0); const w=N.g.localToWorld(home.clone()); N.g.updateMatrixWorld(); const src=V(0,2.35,0); const p=arc(src,N.g.localToWorld(home.clone()),u,1.6); N.book.position.copy(N.g.worldToLocal(p)); if(N.book.position.y<PT+1.3) N.book.position.y=PT+1.3; } }
    WELL.visible=false; wped.visible=false; stakes({},T); layChain(N0,N0,-1,null,T); }
  else if(sh.kind==='slot'||sh.kind==='hold'){ slot(s,T);
    if(sh.id==='wSig') wSig(tNow); else if(sh.id==='wHash') wHash(t); else if(sh.id==='wStake') wStake(tNow); else if(sh.id==='explode') exploded(t);
    if(sh.id==='chain'){ for(let j=0;j<N0;j++){ const a=at('chain',1.2+(N0-1-j)*.2)+.55; if(T>=a&&T<a+1) glowAt(V(BLK[j].g.position.x+1,RY+.3,0),C('#e8c78f'),1.1,.55*decay(T,a,2)); } }
    WELL.visible=T>=SHOT.stake.T0; }
  else if(sh.id==='final') final(t,T);
  else if(sh.id==='programs') programs(t,T);
  else if(sh.id==='close') final(29,T);
  if(sh.kind==='post'){ YT.visible=false; signet.visible=false; wped.visible=false; }
  for(let i=0;i<NN;i++){ const e=EM[i], N=NODES[i]; N.bm.emissive.copy(BLACK).lerp(e.c,e.a*.55); N.pg.emissive.copy(BLACK).lerp(e.c,e.a*.6); }
  railAt(T); camAt(T);
  return {sh,t,s,tl:tNow}; }


/* ======================= sound: one voice per idea, synthesized, off by default ======================= */
let AC=null, MASTER=null, soundOn=false;
function ac(){ if(!AC){ const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return null; AC=new Ctx(); MASTER=AC.createGain(); MASTER.gain.value=.55; const comp=AC.createDynamicsCompressor(); MASTER.connect(comp); comp.connect(AC.destination); } return AC; }
function env(g,t0,a,d,peak){ g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(peak,t0+a); g.gain.exponentialRampToValueAtTime(.0001,t0+a+d); }
function tone(f,d,type,peak,a,f2,delay){ const c=ac(); if(!c) return; const t0=c.currentTime+(delay||0); const o=c.createOscillator(), g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+d); env(g,t0,a||.005,d,peak||.2); o.connect(g); g.connect(MASTER); o.start(t0); o.stop(t0+d+.05); }
let NB=null; function noise(d,peak,lp,delay){ const c=ac(); if(!c) return; if(!NB){ NB=c.createBuffer(1,c.sampleRate*.5,c.sampleRate); const ch=NB.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1; } const t0=c.currentTime+(delay||0); const src=c.createBufferSource(); src.buffer=NB; const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=lp||1200; const g=c.createGain(); env(g,t0,.003,d,peak||.2); src.connect(fl); fl.connect(g); g.connect(MASTER); src.start(t0); src.stop(t0+d+.05); }
const SFX={
  seal:()=>{ tone(92,.22,'sine',.5,.004,58); noise(.07,.18,900); },                      // signature: a soft stamp
  fit:p=>{ tone(880*(p||1),.12,'sine',.07,.004); },                                          // a check that passes
  ridge:()=>{ tone(520,.05,'triangle',.18,.002,420); noise(.03,.1,3000); },                // fingerprint: a wooden click
  brass:()=>{ [660,990,1320].forEach((f,k)=>tone(f,.5,'sine',.05,.02,null,k*.04)); },
  coin:p=>{ tone(1560*(p||1),.35,'sine',.07,.002); tone(2340*(p||1),.2,'sine',.03,.002); }, // stake: a small ping
  red:()=>{ tone(196,.35,'sawtooth',.06,.01,150); tone(207,.35,'sawtooth',.05,.01,160); }, // something fails
  burn:()=>{ noise(.5,.12,500); tone(110,.4,'sine',.08,.05,70); },
  vote:p=>{ tone(440*(p||1),.25,'triangle',.08,.004); },
  lock:()=>{ [196,294,392].forEach((f,k)=>tone(f,1.6,'sine',.09,.03,null,k*.02)); tone(784,1.2,'sine',.03,.2); }, // finality
  gear:()=>{ noise(.02,.08,4000); },
  swell:()=>{ [262,330,392,523].forEach((f,k)=>tone(f,2.6,'sine',.05,.4,null,k*.12)); }
};
const sT=s=>{ for(const sh of SHOTS){ if(sh.kind==='slot'&&s>=sh.s0&&s<=sh.s1){ const lead=sh.lead||0; return sh.T0+lead+(s-sh.s0)/(sh.s1-sh.s0)*(sh.dur-lead); } } return null; };
const EV=[]; const ev=(T,k,p)=>{ if(T!==null&&isFinite(T)) EV.push([T,k,p]); };
ev(sT(SL.stamp),'seal'); for(let i=0;i<NN;i++) ev(sT(gosT(i)),'fit',1+ringDist(0,i)*.06);
ev(at('wSig',1.7+2.1),'red'); ev(at('wSig',1.7+4.0),'red');
for(let j=0;j<N0;j++) ev(at('chain',1.2+(N0-1-j)*.2+.45),'ridge');
ev(at('wHash',2.6),'red'); ev(at('wHash',3.8),'red'); ev(at('wHash',5.5),'seal'); ev(at('wHash',7.9),'seal'); ev(at('wHash',9.2),'red');
for(let i=0;i<NN;i+=2) ev(at('stake',1.0+i*.07),'coin',.9+i*.02);
for(let k=1;k<10;k++) ev(sT(hopT(k)),'fit',.75);
ev(sT(SL.ridge0),'brass'); ev(sT(SL.bseal),'seal');
COM.forEach((c,k)=>ev(sT(voteLand(k)),'vote',1+k*.12));
ev(at('explode',1.3),'brass'); ev(at('explode',6.2),'ridge');
ev(sT(SL.land),'ridge'); ev(sT(SL.land)+.05,'fit',1.5); ev(sT(SL.bcheck),'fit',1.2);
for(let k=0;k<3;k++) ev(sT(SL.fee0+k*.3+.8),'burn');
for(let k=0;k<2;k++) ev(sT(SL.tip0+k*.3+.9),'coin');
[P,...COM].forEach((i,idx)=>ev(sT(SL.iss0+idx*.08+.6),'coin',1.2));
ev(at('wStake',1.7+1.6),'seal'); ev(at('wStake',1.7+2.1),'seal'); ev(at('wStake',1.7+3.4),'red'); ev(at('wStake',1.7+5.6),'burn');
for(let j=11;j<=20;j++) ev(at('final',LF[j]),'ridge');
[8,12,16].forEach(cp=>ev(at('final',Jf(cp)),'fit',1.3)); [8,12].forEach(cp=>ev(at('final',Ff(cp)),'lock'));
ev(at('final',22),'red');
for(let k=0;k<12;k++) ev(at('programs',5+k*.25),'gear');
for(let i=0;i<NN;i++) if(i!==CHN) ev(at('programs',9.8+ringDist(0,i)*.2),'fit',1+ringDist(0,i)*.05);
ev(at('close',1),'swell');
ev(at('scarcity',3.5),'coin'); ev(at('scarcity',8.2),'fit',1.2); ev(at('scarcity',8.25),'red');
EV.sort((a,b)=>a[0]-b[0]);
let lastEvT=0;
function fireSounds(prevT,T){ if(!soundOn||!AC||T<prevT||T-prevT>.2) return; for(const [t,k,p] of EV){ if(t>prevT&&t<=T) SFX[k](p); if(t>T) break; } }

/* ======================= post ======================= */
let composer=null, bokeh=null;
try{ const rt=new THREE.WebGLRenderTarget(2,2,{samples:4}); composer=new THREE.EffectComposer(renderer,rt); composer.addPass(new THREE.RenderPass(scene,camera));
  bokeh=new THREE.BokehPass(scene,camera,{focus:10,aperture:.00042,maxblur:.0065}); composer.addPass(bokeh);
  const vig=new THREE.ShaderPass(THREE.VignetteShader); vig.uniforms.offset.value=1.05; vig.uniforms.darkness.value=.5; composer.addPass(vig);
  composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader)); }catch(e){ composer=null; renderer.outputEncoding=THREE.sRGBEncoding; }

/* ======================= controls ======================= */
const stageEl=document.getElementById('stage');
let W=1,Hh=1,framed=false,PULL=1;
function resize(){ const ww=window.innerWidth, wh=window.innerHeight; let x=0,y=0; W=ww; Hh=wh; if(framed){ W=Math.min(ww,wh*16/9); Hh=W*9/16; x=(ww-W)/2; y=(wh-Hh)/2; }
  stageEl.style.inset='auto'; stageEl.style.left=x+'px'; stageEl.style.top=y+'px'; stageEl.style.width=W+'px'; stageEl.style.height=Hh+'px';
  renderer.setSize(W,Hh,false); if(composer) composer.setSize(W,Hh); camera.aspect=W/Hh;
  const hf=2*Math.atan(Math.tan(15*Math.PI/180)*16/9), vf=2*Math.atan(Math.tan(hf/2)/camera.aspect);
  camera.fov=clamp(vf*180/Math.PI,30,66); const ha=2*Math.atan(Math.tan(camera.fov*Math.PI/360)*camera.aspect);
  PULL=clamp(Math.tan(hf/2)/Math.tan(ha/2),1,2.2); camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize);
const clipsEl=document.getElementById('clips'), playBtn=document.getElementById('play'), track=document.getElementById('track'), fillEl=document.getElementById('fill'), knob=document.getElementById('knob'), clock=document.getElementById('clock');
const lb=document.getElementById('lbls'), loopBtn=document.getElementById('loop'), frm=document.getElementById('frm'), mapb=document.getElementById('mapb');
track.setAttribute('aria-valuemax',FILM.toFixed(0));
const chStart=k=>k===0?0:SHOT[CHAPTERS[k][1]].T0, chEnd=k=>k<5?chStart(k+1):FILM;
CHAPTERS.forEach((c,k)=>{ const b=document.createElement('b'); b.style.left=(chStart(k)/FILM*100)+'%'; track.appendChild(b); });
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let T=0, playing=!reduce, loopCh=false, last=performance.now();
const chOf=T=>{ let c=0; for(let k=0;k<6;k++) if(T>=chStart(k)) c=k; return c; };
const btns=CHSHORT.map((n,k)=>{ const b=document.createElement('button'); b.innerHTML=`<span class="cn">${k+1}</span><span class="cl"> ${n}</span>`; b.setAttribute('aria-label',`Chapter ${k+1}: ${CHAPTERS[k][0]}`); b.onclick=()=>{ T=chStart(k); setPlaying(true); }; clipsEl.appendChild(b); return b; });
const setPlaying=v=>{playing=v;playBtn.textContent=v?'Pause':'Play';};
setPlaying(playing);
playBtn.onclick=()=>setPlaying(!playing);
loopBtn.onclick=()=>{ loopCh=!loopCh; loopBtn.setAttribute('aria-pressed',String(loopCh)); };
function seekFrom(e){ const r=track.getBoundingClientRect(); T=clamp((e.clientX-r.left)/r.width)*FILM; }
track.addEventListener('pointerdown',e=>{ track.setPointerCapture(e.pointerId); setPlaying(false); seekFrom(e); });
track.addEventListener('pointermove',e=>{ if(track.hasPointerCapture(e.pointerId)) seekFrom(e); });
track.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){T=Math.min(FILM,T+1);setPlaying(false);} if(e.key==='ArrowLeft'){T=Math.max(0,T-1);setPlaying(false);} });
lb.onclick=()=>{ const off=document.body.classList.toggle('nolabels'); lb.setAttribute('aria-pressed',String(!off)); };
mapb.onclick=()=>{ const off=document.body.classList.toggle('nomap'); mapb.setAttribute('aria-pressed',String(!off)); };
frm.onclick=()=>{ framed=!framed; document.body.classList.toggle('framed',framed); frm.setAttribute('aria-pressed',String(framed)); resize(); };
window.addEventListener('keydown',e=>{ if(e.key===' '){ e.preventDefault(); setPlaying(!playing); } else if(e.key==='h'||e.key==='H'){ document.body.classList.toggle('clean'); } else if(e.key==='l'||e.key==='L'){ lb.click(); } else if(e.key==='m'||e.key==='M'){ mapb.click(); } else if(e.key==='f'||e.key==='F'){ frm.click(); } else if(/^[1-6]$/.test(e.key)){ T=chStart(+e.key-1); setPlaying(true); } });
window.__seekShot=(id,s)=>{ T=SHOT[id].T0+s; setPlaying(false); };
const sndBtn=document.getElementById('snd'); sndBtn.onclick=()=>{ soundOn=!soundOn; if(soundOn){ const c=ac(); if(c&&c.state==='suspended') c.resume(); } sndBtn.setAttribute('aria-pressed',String(soundOn)); };
const recBtn=document.getElementById('rec'); let rec=null;
function startRec(){ const c=chOf(T); rec={c,prevFramed:framed}; document.body.classList.add('recording','clean'); if(!framed) frm.click(); T=chStart(c); setPlaying(true); recBtn.setAttribute('aria-pressed','true'); }
function stopRec(){ if(!rec) return; document.body.classList.remove('recording','clean'); if(!rec.prevFramed&&framed) frm.click(); rec=null; recBtn.setAttribute('aria-pressed','false'); }
recBtn.onclick=()=>rec?stopRec():startRec();
window.addEventListener('keydown',e=>{ if(e.key==='Escape') stopRec(); else if(e.key==='r'||e.key==='R') recBtn.click(); });
// adaptive quality: if frames run slow, drop resolution, then depth of field
let fAvg=16, fN=0, qLevel=0;
function adapt(dtMs){ fAvg=fAvg*.95+dtMs*.05; fN++; if(fN<90||rec) return; if(fAvg>30&&qLevel===0){ qLevel=1; renderer.setPixelRatio(1); resize(); fN=0; } else if(fAvg>30&&qLevel===1&&bokeh){ qLevel=2; bokeh.enabled=false; fN=0; } }
function frame(now){
  const dtRaw=now-last; const dt=Math.min(.05,dtRaw/1000); last=now; if(playing) adapt(dtRaw);
  if(rec&&playing&&T+dt>=chEnd(rec.c)-.02){ T=chEnd(rec.c)-.02; setPlaying(false); }
  const T_before=T;
  if(playing){ const c0=chOf(T); T+=dt; if(loopCh&&c0<6&&T>=chEnd(c0)-.01&&c0<5) T=chStart(c0); if(T>FILM) T=0; }
  if(playing) fireSounds(T_before,T);
  const st=world(T);
  camera.position.copy(curT).addScaledVector(curP.clone().sub(curT),PULL); camera.lookAt(curT);
  sun.position.set(curT.x-14,26,curT.z+18); sun.target.position.set(curT.x,0,curT.z);
  const ch=chOf(T); btns.forEach((b,k)=>b.setAttribute('aria-pressed',String(k===ch)));
  const f=T/FILM; fillEl.style.width=(f*100)+'%'; knob.style.left=(f*100)+'%'; track.setAttribute('aria-valuenow',T.toFixed(0));
  clock.textContent=Math.floor(T/60)+':'+String(Math.floor(T%60)).padStart(2,'0');
  if(composer){ bokeh.uniforms.focus.value=camera.position.distanceTo(curT); composer.render(); } else renderer.render(scene,camera);
  placeLabels(st.sh,st.sh.wlead?st.tl:st.t,W,Hh); updateMap(T,st.sh,st.t,st.s); updateOverlays(T,st.sh,st.t);
  requestAnimationFrame(frame);
}
resize(); requestAnimationFrame(frame);
})();
