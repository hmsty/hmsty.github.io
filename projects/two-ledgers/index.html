<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#1f262c; --soft:rgba(31,38,44,.66); --line:rgba(31,38,44,.24); --amber:#d9571a; --bg:#e3e0d8; --halo:rgba(238,236,230,.92);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#10151f; } }
:root[data-theme="dark"]{ --bg:#10151f; }
body.night{ --ink:#e8edf1; --soft:rgba(232,237,241,.68); --line:rgba(232,237,241,.25); --amber:#ff9a5c; --halo:rgba(8,12,18,.85); }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:13.5px;letter-spacing:.01em;color:var(--ink);text-shadow:0 0 2px var(--halo),0 0 7px var(--halo),0 0 12px var(--halo);
  padding-bottom:6px;will-change:transform,opacity;transition:color .6s}
.lbl.inst{color:var(--soft);font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.lbl.tick{color:rgba(226,231,235,.88);font-family:'JetBrains Mono',monospace;font-size:10px;padding:0;text-shadow:none}
.lbl.event{font-weight:600;font-size:14px}
.lbl.num{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:12px}
.lbl.warm{color:var(--amber)}
.hud{position:fixed;left:max(20px,env(safe-area-inset-left));top:calc(18px + env(safe-area-inset-top,0px));
  font-size:12.5px;color:var(--soft);font-family:'JetBrains Mono',monospace;transition:opacity .8s,color .6s}
.hud b{font-weight:500;color:var(--ink);margin-right:10px}
.title{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.title h1{margin:0;font-weight:400;font-size:clamp(34px,5vw,60px);letter-spacing:-.02em}
.title p{margin:.6em 0 0;font-size:clamp(15px,1.5vw,18px);color:var(--soft)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;
  padding:14px max(20px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left));font-size:13px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:0;padding:7px 14px;cursor:pointer;min-height:34px;transition:color .6s,border-color .6s}
button:hover{border-color:var(--soft)}
button:focus-visible,.track:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.track{position:relative;flex:1;height:28px;cursor:pointer}
.track::before{content:"";position:absolute;left:0;right:0;top:13px;height:1px;background:var(--line)}
.track i{position:absolute;left:0;top:13px;height:1px;background:var(--ink);transition:background .6s}
.track s{position:absolute;top:9px;width:9px;height:9px;margin-left:-4px;background:var(--amber);text-decoration:none}
.hint{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);font-size:13px;color:var(--soft);pointer-events:none;text-align:center}
.err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:16px}
</style>

<canvas id="gl" tabindex="0" aria-label="Three-dimensional scene: an order for 100 shares fills in Nasdaq's limit order book, is novated and netted at NSCC, settles at DTC, and is minted as a token on Ethereum through the builder, relay, proposer and attestation process."></canvas>
<div id="labels" aria-hidden="true"></div>
<div class="title" id="title"><h1>Two ledgers</h1><p>One tokenized share, from order to finality</p></div>
<div class="hud" id="hud"><b id="clock"></b><span id="rate"></span></div>
<div class="hint" id="hint">Drag to look around. The world keeps running.<br><span style="font-size:11.5px">Illustrative. MERI is fictional. DTCC's production runs so far used Besu and Canton, not Ethereum.</span></div>
<div class="bar">
  <button id="play">Pause</button>
  <div class="track" id="track" role="slider" tabindex="0" aria-label="Story position" aria-valuemin="0" aria-valuemax="142" aria-valuenow="0"><i id="fill"></i><s id="knob"></s></div>
  <button id="mode">Explore</button>
</div>
<div class="err" id="err">This piece needs WebGL, which this browser has turned off.</div>
<script>
(function(){
'use strict';
if(!window.THREE){ document.getElementById('err').style.display='flex'; return; }
THREE.ColorManagement.legacyMode=false;
const canvas=document.getElementById('gl');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true}); }catch(e){ document.getElementById('err').style.display='flex'; return; }
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,0.3,700);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const C=h=>new THREE.Color(h);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,u)=>a+(b-a)*u;
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const smooth=x=>x*x*x*(x*(x*6-15)+10);
const win=(t,a,b,f)=>Math.min(seg(t,a,a+f),1-seg(t,b-f,b));
const frac=x=>x-Math.floor(x);
const mod=(a,n)=>((a%n)+n)%n;
const hash=n=>{ n=Math.imul(n^0x9e3779b9,0x85ebca6b); n^=n>>>13; n=Math.imul(n,0xc2b2ae35); n^=n>>>16; return (n>>>0); };
function rng(seed){ return ()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }; }
const fmtN=n=>Math.abs(n).toLocaleString('en-US');
const DUR=142;

/* ================= light and ground ================= */
const SKY=[[0,'#0d1119'],[5.4,'#0d1119'],[6.6,'#3b3a4c'],[7.5,'#e0c3ad'],[8.8,'#e3e0d8'],[16.2,'#e3e0d8'],[17.6,'#dcb293'],[18.7,'#4a4458'],[19.6,'#0d1119'],[24,'#0d1119']].map(k=>[k[0],C(k[1])]);
const SUN=[[0,0],[6.2,0],[7.8,1],[16.3,1],[18.4,0],[24,0]];
function keyColor(keys,h,out){ for(let i=0;i<keys.length-1;i++){ if(h>=keys[i][0]&&h<=keys[i+1][0]){ const u=(h-keys[i][0])/(keys[i+1][0]-keys[i][0]); return out.copy(keys[i][1]).lerp(keys[i+1][1],u); } } return out.copy(keys[0][1]); }
function keyNum(keys,h){ for(let i=0;i<keys.length-1;i++){ if(h>=keys[i][0]&&h<=keys[i+1][0]){ const u=(h-keys[i][0])/(keys[i+1][0]-keys[i][0]); return lerp(keys[i][1],keys[i+1][1],smooth(u)); } } return keys[0][1]; }
scene.background=C('#e3e0d8'); scene.fog=new THREE.Fog(scene.background,85,250);
const hemi=new THREE.HemisphereLight(0xffffff,0xaab3ba,.75); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffead6,1.6); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-95,right:95,top:95,bottom:-95,near:1,far:400}); sun.shadow.bias=-.0004; sun.shadow.normalBias=.03;
sun.target.position.set(0,0,-6); scene.add(sun,sun.target);
const nightL=new THREE.DirectionalLight(0x8fa6d6,0); nightL.position.set(-40,80,60); scene.add(nightL);
if(THREE.RoomEnvironment){ const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(new THREE.RoomEnvironment(),.04).texture; }
const matForm=new THREE.MeshStandardMaterial({color:'#c9ced2',metalness:.82,roughness:.3});            // brushed stainless
const matDark=new THREE.MeshStandardMaterial({color:'#2d3238',metalness:.15,roughness:.62});            // graphite pads
const matCeramic=new THREE.MeshStandardMaterial({color:'#f1efea',roughness:.55});
const matScreen=new THREE.MeshStandardMaterial({color:'#1b2024',roughness:.4,metalness:.2,emissive:'#0e1418',emissiveIntensity:.4});
const concreteTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=512; const g=c.getContext('2d'); g.fillStyle='#b9b6ae'; g.fillRect(0,0,512,512);
  const R0=rng(3); for(let i=0;i<9000;i++){ const v=150+Math.floor(R0()*60); g.fillStyle=`rgba(${v},${v-2},${v-6},${.05+R0()*.08})`; g.fillRect(R0()*512,R0()*512,1+R0()*3,1+R0()*3); }
  g.strokeStyle='rgba(70,70,66,.32)'; g.lineWidth=2; g.beginPath(); g.moveTo(0,1); g.lineTo(512,1); g.moveTo(1,0); g.lineTo(1,512); g.stroke();
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(90,90); t.encoding=THREE.sRGBEncoding; t.anisotropy=8; return t; })();
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({color:'#ffffff',map:concreteTex,roughness:.92})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
// painted floor stencils in place of floating name tags
const STENCILS=[];
function stencil(text,x,z,w,paint,rot){ const c=document.createElement('canvas'); c.width=1024; c.height=192; const tex=new THREE.CanvasTexture(c); tex.encoding=THREE.sRGBEncoding; tex.anisotropy=8;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w*192/1024),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}));
  m.rotation.x=-Math.PI/2; m.rotation.z=rot||0; m.position.set(x,.03,z); scene.add(m);
  const draw=()=>{ const g=c.getContext('2d'); g.clearRect(0,0,1024,192); g.fillStyle=paint; g.textAlign='center'; g.textBaseline='middle';
    let fs=128; const set=()=>{ g.font=`600 ${fs}px 'Barlow Condensed', 'Arial Narrow', sans-serif`; if('letterSpacing' in g) g.letterSpacing=Math.round(fs*.14)+'px'; };
    set(); while(g.measureText(text).width>960&&fs>40){ fs-=4; set(); } g.fillText(text,512,100); tex.needsUpdate=true; };
  draw(); STENCILS.push({draw,m}); return m; }
const UNIT=new THREE.BoxGeometry(1,1,1);
function box(w,h,d,x,y,z,mat,cast=true){ const m=new THREE.Mesh(UNIT,mat||matForm); m.scale.set(w,h,d); m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=true; scene.add(m); return m; }
const GT=(()=>{ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); const gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.22,'rgba(255,255,255,.5)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); })();
function glow(color,size,op){ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,color,transparent:true,opacity:op===undefined?.6:op,depthWrite:false})); s.scale.set(size,size,1); scene.add(s); return s; }
function lineMat(color,op){ return new THREE.LineBasicMaterial({color,transparent:true,opacity:op===undefined?1:op,depthWrite:false}); }
function tube(curve,r,mat){ const m=new THREE.Mesh(new THREE.TubeGeometry(curve,140,r,6,false),mat); scene.add(m); return m; }
function dynLines(color){ const l=new THREE.LineSegments(new THREE.BufferGeometry(),lineMat(color,0)); scene.add(l); return l; }
function setLines(l,pts,op){ l.geometry.setFromPoints(pts.length?pts:[V(),V()]); l.material.opacity=pts.length?op:0; }
const matAmber=new THREE.MeshStandardMaterial({color:'#ff8a45',emissive:'#ff7428',emissiveIntensity:.85,roughness:.45});
const matBuy=new THREE.MeshStandardMaterial({color:'#5c6b77',roughness:.7});
const matSell=new THREE.MeshStandardMaterial({color:'#e8edf0',roughness:.8});
const matTether=new THREE.MeshBasicMaterial({color:'#9aa8b2',transparent:true,opacity:.5});
const matAccent=new THREE.MeshStandardMaterial({color:'#4a78a6',emissive:'#4a78a6',emissiveIntensity:.25,roughness:.6});

/* ================= layout ================= */
const N=V(-44,0,-15.8);            // exchange
const RC=V(-24,4.2,4), RR=4.6;     // clearinghouse tray
const RCF=V(-24,4.5,6.4);          // where trade reports land on the tray
const P={ investor:V(-54,0,8), dtc:V(4,0,-10) };
const D=V(40,0,-2);                // validator dial centre
const WAL=V(22,0,12);              // broker's registered wallet
const CON=V(40,0,-2);              // token contract, at the heart of the helix
const RELAY=V(40,0,20.6);
const BLD=[V(31,0,26),V(40,0,28),V(49,0,26)];

/* ================= brokers and the clearinghouse ================= */
const BROK=[];
for(let i=0;i<10;i++){ const a=Math.PI+i*(Math.PI*2/10); const x=RC.x+15.5*Math.cos(a), z=RC.z+15.5*Math.sin(a);
  const m=box(3.2,1.1,2,x,.55,z,matDark); m.rotation.y=-a+Math.PI/2;
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,2.5,10),matForm); stem.position.set(x,1.1+1.25,z); stem.castShadow=true; scene.add(stem);
  const plate=box(1.05,.06,1.05,x,3.6,z); plate.rotation.y=m.rotation.y;
  const net=box(.55,1,.55,x,3.6,z,matBuy); net.rotation.y=m.rotation.y;
  const ghost=new THREE.LineSegments(new THREE.EdgesGeometry(UNIT),lineMat('#56636c',.55)); ghost.position.set(x,3.6,z); ghost.rotation.y=m.rotation.y; scene.add(ghost);
  BROK.push({x,z,a,rot:m.rotation.y,net,ghost,plateY:3.63,edge:V(RC.x+RR*Math.cos(a),RC.y,RC.z+RR*Math.sin(a))});
}
const OURS=0, SELLER=5, OTHERBUYER=3;
box(1.3,1.3,1.3,P.investor.x,.65,P.investor.z,matCeramic);
const ring=new THREE.Mesh(new THREE.TorusGeometry(RR,.26,24,180),matForm); ring.position.copy(RC); ring.rotation.x=Math.PI/2; ring.castShadow=true; scene.add(ring);
const tray=new THREE.Mesh(new THREE.CylinderGeometry(RR-.1,RR-.1,.08,96),matForm); tray.position.set(RC.x,RC.y-.1,RC.z); tray.receiveShadow=tray.castShadow=true; scene.add(tray);
box(.28,RC.y,.28,RC.x,RC.y/2,RC.z);
const colOwedTo=box(.7,1,.7,RC.x-.55,RC.y,RC.z,matBuy), colOwedBy=box(.7,1,.7,RC.x+.55,RC.y,RC.z,matSell);

/* trades: earlier today, the story's two fills, and the afternoon */
const TRADES=[];
(function(){ const R=rng(77); const pick=()=>[100,200,300,400,500][Math.floor(R()*5)];
  for(let k=0;k<34;k++){ const b=Math.floor(R()*10); let s=Math.floor(R()*10); if(s===b) s=(s+3)%10; TRADES.push({b,s,size:pick(),tLeg:-1,pre:true}); }
  { let pn=0; TRADES.forEach(t=>{ if(t.b===OURS) pn+=t.size; if(t.s===OURS) pn-=t.size; }); const need=Math.max(0,300-pn); if(need>0) TRADES.push({b:OURS,s:7,size:need,tLeg:-1,pre:true}); }
  TRADES.push({b:OURS,s:SELLER,size:100,tEx:26.6,tRing:30.6,tLeg:34.2,ours:true});
  for(let k=0;k<26;k++){ const t=37.8+k*(5.4/26)+R()*.12; let b=Math.floor(R()*10), s=Math.floor(R()*10); if(s===b) s=(s+4)%10; if(k%4===0) b=OURS; if(s===OURS) s=6; if(s===b) s=(s+1)%10; TRADES.push({b,s,size:pick(),tEx:t-1.3,tRing:t-.45,tLeg:t+.25}); }
})();
function positions(s){ const out=BROK.map(()=>({buy:0,sell:0})); let gross=0;
  TRADES.forEach(t=>{ if(t.pre||s>=t.tLeg){ out[t.b].buy+=t.size; out[t.s].sell+=t.size; gross+=t.size; } }); return {out,gross}; }
const FINAL=positions(99);
const K_NET=2.1/Math.max(...FINAL.out.map(p=>Math.abs(p.buy-p.sell)));
const K_GROSS=3.2/Math.max(...FINAL.out.map(p=>p.buy+p.sell));
const K_CENTER=2.6/FINAL.gross;
const SUMPOS=FINAL.out.reduce((a,p)=>a+Math.max(0,p.buy-p.sell),0);
const legs=[]; for(let i=0;i<14;i++) legs.push(box(.26,.26,.26,0,-9,0,matBuy,false));
const legsS=[]; for(let i=0;i<14;i++) legsS.push(box(.26,.26,.26,0,-9,0,matSell,false));
const pairsB=[],pairsS=[]; for(let i=0;i<8;i++){ pairsB.push(box(.3,.3,.3,0,-9,0,matBuy,false)); pairsS.push(box(.3,.3,.3,0,-9,0,matSell,false)); }
const oblig=[]; for(let i=0;i<30;i++) oblig.push(box(.16,.16,.16,0,-9,0,matBuy,false));

/* ================= the exchange: a limit order book ================= */
box(10.6,.5,5.6,N.x,.25,N.z,matDark);
const TICKX=i=>N.x-4.3+i*.9+(i>=5?.4:0);
const PRICE=i=>(84.16+i*.01).toFixed(2);
box(9.9,.05,.1,N.x,.53,N.z+.6,matForm);
for(let i=0;i<10;i++) box(.05,.06,.3,TICKX(i),.53,N.z+.6,matForm);
// gateway arch at the front, tape panel at the back

box(9.4,1.8,.08,N.x,.5+.9,N.z-2.65,matScreen);
const H_PER=.0014;
const STACKS=[
  [500,300],[400,200,200],[600,300],[200,400,100],
  [300,200,400],
  [100,300,{size:200,arrive:21.6}],[400,200],[300,500],[200,200,300],[600]
].map((arr,i)=>arr.map((o,k)=>{ const ord=typeof o==='number'?{size:o}:o; ord.flick=(i!==4&&i!==5&&k===arr.length-1)?(i*.137%1):-1; ord.side=i<5?'bid':'ask'; if(!ord.ours) ord.mesh=box(.64,ord.size*H_PER*.94,.64,TICKX(i),0,N.z,i<5?matBuy:matSell); return ord; }));
const incoming=box(.64,400*H_PER,.64,0,-9,0,matSell); incoming.add(new THREE.LineSegments(new THREE.EdgesGeometry(UNIT),lineMat('#27323a',.8)));
function ordPresent(i,k,s){ const o=STACKS[i][k]; if(o.arrive&&s<o.arrive&&!explore) return false; if(i===5&&k===0&&s>26.05&&!explore) return false; return true; }
function ordLeft(i,k,s){ if(explore) return 1; if(i===5&&k===0) return 1-ease(seg(s,25.6,26.05)); return 1; }
function stackY(i,k,s){ let y=.53; for(let j=0;j<k;j++){ if(ordPresent(i,j,s)) y+=STACKS[i][j].size*H_PER*ordLeft(i,j,s); } return y; }
// the tape: last-sale prints
const PRINTS=[];
const tapeGeo=new THREE.BufferGeometry(), TP=40, tapePos=new Float32Array(TP*3); tapeGeo.setAttribute('position',new THREE.BufferAttribute(tapePos,3));
const tapeDots=new THREE.Points(tapeGeo,new THREE.PointsMaterial({color:'#4a78a6',size:.14,transparent:true,depthWrite:false})); scene.add(tapeDots);
const tapeLine=new THREE.Line(new THREE.BufferGeometry(),lineMat('#4a78a6',.6)); scene.add(tapeLine);

/* ================= DTC, with Cede & Co. inside it ================= */
box(6,12,6,P.dtc.x,6,P.dtc.z);
const STRIPS=[]; for(let i=0;i<19;i++){ const m=new THREE.Mesh(new THREE.PlaneGeometry(4.6,.07),new THREE.MeshBasicMaterial({color:'#c4ccd2'})); m.position.set(P.dtc.x,1.6+i*.5,P.dtc.z+3.01); scene.add(m); STRIPS.push(m); }
const NSCC_ROW=17, OUR_ROW=8, OTHER_ROWS=[3,5,11,14]; const rowY=i=>1.6+i*.5;
const faceBars=[0,1,2,3].map(()=>box(1,.16,.12,0,-9,0,matBuy,false));
// the vitrine on the roof and the folder inside it
const VIT=V(P.dtc.x,12,P.dtc.z);
const glassMat=new THREE.MeshStandardMaterial({color:'#d6e7f6',transparent:true,opacity:.16,roughness:.1,depthWrite:false});
const vit=new THREE.Mesh(UNIT,glassMat); vit.scale.set(4.4,2.6,4.4); vit.position.set(VIT.x,VIT.y+1.3,VIT.z); scene.add(vit);

const dummy=new THREE.Object3D();
function updateWorld(s,rate,dt){
  const tod=((world%86400)+86400)%86400/3600, day=Math.floor(world/86400);
  keyColor(SKY,tod,col); scene.background.copy(col); scene.fog.color.copy(col);
  const sunK=keyNum(SUN,tod), ang=(tod-6)/12*Math.PI;
  sun.position.set(-60*Math.cos(ang)+20,Math.max(8,90*Math.sin(clamp(ang,.12,Math.PI-.12))),50);
  sun.intensity=1.55*sunK; hemi.intensity=.22+.55*sunK; nightL.intensity=.35*(1-sunK);
  hemi.color.setRGB(lerp(.55,1,sunK),lerp(.62,1,sunK),lerp(.8,1,sunK));
  document.body.classList.toggle('night',sunK<.45);
  const nk=1-sunK;
  const envK=.1+.9*sunK; ENVMATS.forEach(m=>m.envMapIntensity=m.userData.env*envK);
  const accent=C('#4a78a6').lerp(C('#a9d4ff'),nk), hot=C('#6fa8ff').lerp(C('#bfe0ff'),nk);
  [E.glass,propLine.material,tapeDots.material,tapeLine.material,sigLine.material].forEach(m=>m.color.copy(accent));
  const tc=C('#9aa8b2').lerp(C('#5a7288'),nk); [matTether,beamMat,walletMat,clrMat,balMat].forEach(m=>m.color.copy(tc));
  lines.material.color.copy(C('#56636c').lerp(C('#9fb3c2'),nk)); obLines.material.color.copy(lines.material.color);
  BROK.forEach(b=>b.ghost.material.color.copy(lines.material.color));
  const open=day<5&&tod>=9.5&&tod<16;

  /* ---- chain engine ---- */
  const target=world/12;
  if(seeked||target<vslot){ vslot=target; seeked=false; }
  else { if(target-vslot>28) vslot=target-28; vslot=Math.min(target,vslot+Math.max(dt/12,16*dt)); }
  const n=Math.floor(vslot), ph=frac(vslot), slow=rate<6, E0=Math.floor(n/32);
  const storyM=!explore&&n===SLOT_M&&s<88.2;
  let li=0, ci=0; const layerCol=accent.clone().lerp(C('#ffffff'),.45);
  const P0=V(), P1=V();
  for(let d=0;d<POOL;d++){
    const m=n-d, b=BLOCKS[d]; helix(m,n,ph,P0);
    let scl=1, vis=(E0-Math.floor(m/32))<RINGS&&P0.y>.95;
    if(d===0&&slow) scl=lerp(.2,1,ease(seg(ph,0,.12)));
    if(storyM&&m===SLOT_M) vis=false;
    b.m.visible=vis;
    if(vis){ b.m.position.copy(P0); b.m.rotation.y=-PHI(mod(m,32)); b.m.scale.setScalar(scl);
      const sp=m===SLOT_M, fin=isFinal(m,n), jus=isJust(m,n);
      b.m.material=sp?(fin?M.aFin:M.aGlass):(fin?M.fin:(jus?M.just:M.glass));
      b.e.material=sp?E.amber:(fin?E.fin:E.glass);
      b.m.castShadow=fin; b.hd.castShadow=fin;
      if(sp){ finPos.copy(P0).add(V(0,1.1,0)); if(fin&&sFin<0&&!explore&&s>96) sFin=s; }
    }
    // hash link to the parent block
    const pv=(E0-Math.floor((m-1)/32))<RINGS; helix(m-1,n,ph,P1);
    b.lk.visible=vis&&pv&&P1.y>.95&&!(storyM&&m===SLOT_M);
    if(b.lk.visible){ const dist=P0.distanceTo(P1); b.lk.position.lerpVectors(P0,P1,.5); b.lk.lookAt(P1); b.lk.scale.set(.1,.1,Math.max(.01,dist-BSZ*.9)); }
    for(let k=0;k<LAYERS;k++){
      if(vis&&!isFinal(m,n)&&scl>.3){ dummy.position.set(P0.x,P0.y+(-.3+k*.11)*scl,P0.z); dummy.rotation.set(0,-PHI(mod(m,32)),0); dummy.scale.setScalar(scl); layers.setColorAt(li,(m===SLOT_M&&k===3)?C('#ff7428'):layerCol); }
      else { dummy.position.set(0,-60,0); dummy.scale.setScalar(.001); }
      dummy.updateMatrix(); layers.setMatrixAt(li++,dummy.matrix);
    }
    const chipsOn=vis&&(m<n||(slow?ph>.46:true));

  faceBars.forEach((b,k)=>{ const u=ease(seg(s,59.8+k*.35,61.6+k*.35)); b.visible=s>59.6&&s<64.8; const y=lerp(rowY(NSCC_ROW),rowY(OTHER_ROWS[k]),u);

    if(o<=.01){ if(L.last!==0){ L.el.style.opacity=0; L.last=0; } return; }

    L.el.style.transform=`translate(${(p.x*.5+.5)*w}px,${(-p.y*.5+.5)*h}px) translate(-50%,${L.side?'0%':'-100%'})`;

const $=id=>document.getElementById(id);
const playBtn=$('play'), modeBtn=$('mode'), track=$('track'), fill=$('fill'), knob=$('knob');
function fmtClock(w){ const d=Math.floor(w/86400), t=((w%86400)+86400)%86400; const hh=Math.floor(t/3600), mm=Math.floor(t%3600/60), ss=Math.floor(t%60); return DAY[mod(d,7)]+' '+(((hh+11)%12)+1)+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+(hh>=12?' pm':' am'); }
function fmtRate(r){ if(r<1.5) return 'real time'; if(r<100) return Math.round(r)+'x speed'; if(r<3600) return Math.round(r/60)+' min per second'; return (r/3600).toFixed(r<36000?1:0)+' hours per second'; }
function setUI(rate){
  $('clock').textContent=fmtClock(world); $('rate').textContent=explore?'real time':fmtRate(rate);
  fill.style.width=(S/DUR*100)+'%'; knob.style.left=(S/DUR*100)+'%'; track.setAttribute('aria-valuenow',Math.round(S));
  playBtn.textContent=explore?'Play':(playing?'Pause':(S>=DUR?'Replay':'Play'));
  modeBtn.textContent=explore?'Resume story':'Explore';
  $('title').style.opacity=explore?0:1-seg(S,5.4,6.8);
  $('hud').style.opacity=explore?1:seg(S,6,7.5);
  $('hint').style.opacity=explore?0:win(S,127,142,1);
}
const START=4.2;
function seek(s){ S=clamp(s,START,DUR); world=worldAt(S); vslot=world/12; seeked=true; snapCam=true; sFin=-1; }
function enterExplore(){ if(explore) return; explore=true; playing=false; controls.target.copy(curT); controls.enabled=true; controls.update(); }
function resumeStory(){ if(!explore) return; explore=false; controls.enabled=false; retFrom.p.copy(camera.position); retFrom.t.copy(controls.target); returning=1; world=worldAt(S); vslot=world/12; seeked=true; playing=true; }
playBtn.addEventListener('click',()=>{ if(explore){ resumeStory(); return; } if(S>=DUR) seek(START); playing=!playing; });
modeBtn.addEventListener('click',()=>{ explore?resumeStory():enterExplore(); });
canvas.addEventListener('pointerdown',()=>enterExplore(),{capture:true});
canvas.addEventListener('wheel',()=>enterExplore(),{capture:true,passive:true});
function trackSeek(e){ const r=track.getBoundingClientRect(); if(explore){ explore=false; controls.enabled=false; playing=true; } returning=0; seek((e.clientX-r.left)/r.width*DUR); }
let dragging=false;
track.addEventListener('pointerdown',e=>{ dragging=true; track.setPointerCapture(e.pointerId); trackSeek(e); });
track.addEventListener('pointermove',e=>{ if(dragging) trackSeek(e); });
track.addEventListener('pointerup',()=>{ dragging=false; });
track.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){ seek(S+5); e.preventDefault(); } if(e.key==='ArrowLeft'){ seek(S-5); e.preventDefault(); } });
document.addEventListener('keydown',e=>{ if(e.target===track) return; if(e.key===' '){ e.preventDefault(); playBtn.click(); } if(e.key==='Escape'&&explore) resumeStory(); });
function resize(){ const w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w<h?54:36; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();

/* ================= loop ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  let rate=1;
  if(!explore){
    if(playing){ S=Math.min(DUR,S+dt); if(S>=DUR) playing=false; }
    const w1=worldAt(S); rate=Math.max(1,(worldAt(Math.min(DUR,S+.05))-w1)/.05); world=w1;
    if(seeked) vslot=world/12;
    camAt(S,camP,camT);
    if(snapCam){ curP.copy(camP); curT.copy(camT); snapCam=false; }
    else { const a=1-Math.exp(-dt*3.2); curP.lerp(camP,a); curT.lerp(camT,a); }
    if(returning>0){ returning=Math.max(0,returning-dt/1.4); const u=smooth(1-returning); camera.position.lerpVectors(retFrom.p,curP,u); tmp.lerpVectors(retFrom.t,curT,u); camera.lookAt(tmp); }
    else { camera.position.copy(curP); camera.lookAt(curT); }
  } else { world+=dt; controls.update(); curP.copy(camera.position); curT.copy(controls.target); }
  updateWorld(S,rate,dt);
  if(!explore) updateStory(S);
  else { pulse.visible=false; setLines(lines,[],0); setLines(execLine,[],0); setLines(sigLine,[],0); flash.material.opacity=0; incoming.visible=false; faceBars.forEach(b=>b.visible=false); spot.material.opacity=0; header.position.y=-9; folderGlow.material.opacity=0;
    BUILD.forEach(B=>{ B.tx.forEach(t=>t.m.position.y=-9); B.lay.forEach(m=>m.visible=false); B.cn.forEach(c=>c.visible=false); B.mg.forEach(c=>c.visible=false); B.shell.material.opacity=0; B.cand.position.set(B.pos.x,1.3,B.pos.z); B.cand.scale.setScalar(1); B.coins.position.set(B.pos.x+1.75,.5,B.pos.z); }); ROUTES.forEach(r=>r.m.opacity=0); probes.forEach(p=>p.position.y=-9); takerCoin.position.y=rebateCoin.position.y=-9; baseCoins.forEach(c=>c.position.y=-9); newCoins.forEach(c=>c.position.y=-9);
    if(S>=63.4){ claim.position.set(BROK[OURS].x,1.16,BROK[OURS].z).add(TANG.clone().multiplyScalar(1.05)); claim.scale.set(.9,.12,.8); } }
  placeShare(S);
  renderer.render(scene,camera);
  updateLabels(); setUI(rate);
  requestAnimationFrame(frame);
}
seek(START); playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
requestAnimationFrame(frame);
window.__dbg={seek,pause:()=>{playing=false;}};
})();
</script>
</body>
</html>
